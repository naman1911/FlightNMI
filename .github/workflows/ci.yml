name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate
      - name: Cloudflare Worker bundles
        run: npm run worker:check
      - name: Docker image builds
        run: docker build -t flightnmi:ci .
