# Cloudflare Workers deployment of FlightNMI.
# Deploy from the Cloudflare dashboard (Workers & Pages -> Create -> import
# this GitHub repository) or locally with:  npx wrangler deploy
name = "flightnmi"
main = "src/worker/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[observability]
enabled = true

# Safety net: once a minute, make sure the watcher's 20-second alarm is armed.
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "WATCHER"
class_name = "Watcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Watcher"]

# Plain defaults. Everything personal (ADMIN_TOKEN, BREVO_API_KEY, EMAIL_FROM,
# PUBLIC_URL) is set in the dashboard under Settings -> Variables and Secrets,
# never here. keep_vars stops a deploy from wiping those dashboard values.
keep_vars = true

[vars]
POLL_SECONDS = "20"
NOTICE_MINUTES = "20"
